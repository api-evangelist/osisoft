name: OSIsoft
description: 'OSIsoft was the enterprise software company behind the PI System, the
  operational data infrastructure used across manufacturing, energy, utilities, oil
  and gas, and other industrial sectors to collect, historize, contextualize, and
  visualize high-volume real-time sensor and control-system time-series data. Its
  developer surface centered on the PI Web API (a RESTful interface to the PI Data
  Archive and Asset Framework), AF SDK, and the PI Square developer community. OSIsoft
  was acquired by AVEVA in 2021; all osisoft.com and docs.osisoft.com properties now
  redirect to AVEVA, where the product ships as the AVEVA PI System. This profile is
  maintained as a historical/acquired-company record in the API Evangelist network,
  with developer resources pointing at the live AVEVA successor pages.'
